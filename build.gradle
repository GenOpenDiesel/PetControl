plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version "3.0.2"
    id "io.papermc.paperweight.userdev" version "2.0.0-beta.21"
}

group = 'org.infotoast'
version = '4.3'

// Paper build we compile against. Bump these (and only these) when moving to a new MC release.
ext.paperVersion = '26.1.2.build.74-stable'
ext.minecraftVersion = '26.1.2'

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    paperweight.paperDevBundle(project.ext.paperVersion)
}

def targetJavaVersion = 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

runServer {
    minecraftVersion(project.ext.minecraftVersion)
}

// Uzywane przez CI, zeby tag release'a nie byl zahardkodowany
tasks.register('printVersion') {
    def v = project.version.toString()
    doLast { println v }
}

// NOTE: there is deliberately no `dependsOn(reobfJar)` here.
// Paper runs Mojang-mapped at runtime and 26.x no longer remaps Spigot-mapped
// plugins, so a reobfuscated jar dies with
//   NoClassDefFoundError: net/minecraft/world/entity/EntityTameableAnimal
// paperweight-userdev 2.x produces a Mojang-mapped jar by default -- that is what we ship.
