name: PetControl
version: '${version}'
main: org.infotoast.petcontrol.PetControl
api-version: '26.1'
description: Zarzadzanie zwierzakami - info, oswajanie, przekazywanie wlascicielstwa
load: STARTUP
author: Frank
website: infotoast.org
commands:
  petinfo:
    description: Pokazuje informacje o stworzeniu, na ktore patrzysz
    permission: petcontrol.petinfo
    usage: "§cUzycie: /<command> - wyceluj w stworzenie"
  transferpetowner:
    description: Przekazuje zwierzaka innemu graczowi
    permission: petcontrol.transferpetowner
    usage: "§cUzycie: /<command> <gracz>"
  tamepet:
    description: Oswaja dzikie zwierze
    permission: petcontrol.tamepet
    usage: "§cUzycie: /<command> [gracz]"
  togglesit:
    description: Sadza lub podnosi zwierzaka
    permission: petcontrol.togglesit
    usage: "§cUzycie: /<command>"
  healpet:
    description: Leczy zwierzaka, na ktorego patrzysz
    permission: petcontrol.heal
    usage: "§cUzycie: /<command>"
  roam:
    description: Ustawia zwierzakowi teren do chodzenia zamiast chodzenia za Toba
    permission: petcontrol.roam
    usage: "§cUzycie: /<command> <promien> [srodek x] [srodek z] [pilnowanie]"
  follow:
    description: Przywraca zwierzakowi chodzenie za Toba
    permission: petcontrol.follow
    usage: "§cUzycie: /<command>"
  guard:
    description: Wlacza/wylacza pilnowanie terenu przez zwierzaka
    permission: petcontrol.guard
    usage: "§cUzycie: /guard"

permissions:
  petcontrol.petinfo:
    description: Pozwala uzywac /petinfo
    default: true
  petcontrol.transferpetowner:
    description: Pozwala przekazywac zwierzaki innym graczom
    default: op
  petcontrol.tamepet.self:
    description: Pozwala oswajac zwierzaki dla siebie
    default: op
  petcontrol.tamepet.others:
    description: Pozwala oswajac zwierzaki dla innych graczy
    default: op
  petcontrol.togglesit:
    description: Pozwala sadzac i podnosic zwierzaki
    default: op
  petcontrol.heal:
    description: Pozwala leczyc zwierzaki
    default: op
  petcontrol.roam:
    description: Pozwala ustawiac zwierzakom teren do chodzenia
    default: true
  petcontrol.roam.others:
    description: Pozwala ustawiac teren zwierzakom innych graczy
    default: op
  petcontrol.roam.guarded:
    description: Pozwala wlaczac pilnowanie terenu przy /roam
    default: op
  petcontrol.follow:
    description: Pozwala uzywac /follow
    default: true
  petcontrol.follow.others:
    description: Pozwala zmieniac tryb zwierzakom innych graczy
    default: op
  petcontrol.guard:
    description: Pozwala uzywac /guard
    default: op
